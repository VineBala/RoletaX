#Forcar Build v2.1
name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing or new version tag to publish (leave blank to build only)
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platforms;android-36.1 build-tools;36.1.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug signing key
        run: keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Name APK
        run: cp app/build/outputs/apk/debug/Vortex-debug.apk Vortex.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vortex-apk
          path: Vortex.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "Vortex" --notes "APK atualizado do Project Vortex. Assinado com uma chave temporária de depuração; futuras atualizações podem exigir desinstalar a versão anterior."
            gh release upload "$RELEASE_TAG" Vortex.apk --clobber
            gh release delete-asset "$RELEASE_TAG" app-debug.apk --yes || true
          else
            gh release create "$RELEASE_TAG" Vortex.apk --title "Vortex" --notes "APK do Project Vortex. Assinado com uma chave temporária de depuração; futuras atualizações podem exigir desinstalar a versão anterior."
          fi
